<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tävlingsanmälningar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .row-withdrawn { opacity: 0.65; background-color: #fdf2f2; }
    .badge-confirmed { background-color: #198754; }
    .badge-withdrawn { background-color: #dc3545; }
  </style>
</head>
<body>
  <div class="container-fluid py-3 px-2 px-md-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div>
        <h5 class="mb-0 fw-bold">Bekräftade Tävlingsanmälningar</h5>
        <small class="text-muted" id="lastUpdated">Hämtar anmälningar...</small>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="showWithdrawn">
          <label class="form-check-label small" for="showWithdrawn">Visa avanmälda</label>
        </div>
        <button id="syncBtn" class="btn btn-sm btn-primary d-flex align-items-center gap-1" onclick="triggerSync()">
          Synka &amp; uppdatera
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-5">
        <select id="tournamentFilter" class="form-select form-select-sm">
          <option value="ALL">Alla kommande tävlingar</option>
        </select>
      </div>
      <div class="col-12 col-md-5">
        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Sök spelare eller klass (t.ex. HS U15)...">
      </div>
      <div class="col-12 col-md-2 d-grid">
        <span class="btn btn-sm btn-outline-secondary disabled" id="countBadge">0 anmälningar</span>
      </div>
    </div>

    <!-- Results Table -->
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 small">
          <thead class="table-light">
            <tr>
              <th>Tävling</th>
              <th>Datum</th>
              <th>Klass</th>
              <th>Spelare</th>
              <th>Partner</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="entriesBody">
            <tr>
              <td colspan="6" class="text-center py-4 text-muted">Laddar tävlingsdata...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Server-injected payload from doGet() — renders immediately without a second RPC call
    const INITIAL_PAYLOAD = <?!= initialDataJson ?>;
    let allEntries = [];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tournamentFilter').addEventListener('change', renderTable);
      document.getElementById('searchInput').addEventListener('input', renderTable);
      document.getElementById('showWithdrawn').addEventListener('change', renderTable);

      if (INITIAL_PAYLOAD && Array.isArray(INITIAL_PAYLOAD.entries)) {
        initData(INITIAL_PAYLOAD);
      } else {
        google.script.run
          .withSuccessHandler(initData)
          .withFailureHandler(showError)
          .getPublicTournamentEntries(false);
      }
    });

    function triggerSync() {
      const btn = document.getElementById('syncBtn');
      const statusEl = document.getElementById('lastUpdated');
      const previousStatus = statusEl.textContent;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Synkar...';
      statusEl.textContent = 'Hämtar senaste bekräftelsemail från Gmail...';

      google.script.run
        .withSuccessHandler(payload => {
          btn.disabled = false;
          btn.textContent = 'Synka & uppdatera';
          initData(payload);
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = 'Synka & uppdatera';
          statusEl.textContent = previousStatus;
          alert('Synkronisering misslyckades: ' + (err.message || err));
        })
        .syncAndGetTournamentEntries();
    }

    function initData(payload) {
      allEntries = payload.entries || [];
      document.getElementById('lastUpdated').textContent = payload.lastUpdated
        ? `Senast synkad från bekräftelsemail: ${payload.lastUpdated}`
        : 'Inga aktiva bekräftelser hittades';

      const select = document.getElementById('tournamentFilter');
      const previousSelection = select.value;
      select.innerHTML = '<option value="ALL">Alla kommande tävlingar</option>';

      const seen = new Set();
      allEntries.forEach(item => {
        const label = `${item.tournamentName} (${item.tournamentDate})`;
        if (!seen.has(label)) {
          seen.add(label);
          const opt = document.createElement('option');
          opt.value = label;
          opt.textContent = label;
          select.appendChild(opt);
        }
      });

      if ([...select.options].some(opt => opt.value === previousSelection)) {
        select.value = previousSelection;
      }

      renderTable();
    }

    function renderTable() {
      const selectedTournament = document.getElementById('tournamentFilter').value;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const includeWithdrawn = document.getElementById('showWithdrawn').checked;
      const tbody = document.getElementById('entriesBody');

      const filtered = allEntries.filter(item => {
        if (!includeWithdrawn && item.withdrawn) return false;

        const tourLabel = `${item.tournamentName} (${item.tournamentDate})`;
        if (selectedTournament !== 'ALL' && tourLabel !== selectedTournament) return false;

        if (query) {
          const haystack = `${item.tournamentName} ${item.klass} ${item.player1} ${item.player2}`.toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      document.getElementById('countBadge').textContent = `${filtered.length} anmälningar`;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Inga anmälningar matchar filtret.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const rowClass = item.withdrawn ? 'row-withdrawn' : '';
        const statusBadge = item.withdrawn
          ? `<span class="badge badge-withdrawn">Avanmäld${item.removedOn ? ' (' + item.removedOn.split(' ')[0] + ')' : ''}</span>`
          : `<span class="badge badge-confirmed">${escapeHtml(item.status || 'Anmäld')}</span>`;

        return `
          <tr class="${rowClass}">
            <td class="fw-semibold">${escapeHtml(item.tournamentName)}</td>
            <td class="text-nowrap">${escapeHtml(item.tournamentDate)}</td>
            <td><span class="badge bg-secondary">${escapeHtml(item.klass)}</span></td>
            <td>${escapeHtml(item.player1)}</td>
            <td>${escapeHtml(item.player2 || '-')}</td>
            <td>${statusBadge}</td>
          </tr>
        `;
      }).join('');
    }

    function showError(err) {
      document.getElementById('entriesBody').innerHTML =
        `<tr><td colspan="6" class="text-center py-4 text-danger">Kunde inte ladda data: ${escapeHtml(err.message)}</td></tr>`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
