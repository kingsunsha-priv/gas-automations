<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header-bar {
      background: #1b365d;
      color: #fff;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .nav-pills .nav-link {
      color: #1b365d;
      font-weight: 600;
    }
    .nav-pills .nav-link.active {
      background-color: #1b365d;
      color: #fff;
    }
    .rank-badge {
      display: inline-block;
      min-width: 2.2rem;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      background-color: #e7f1ff;
      color: #0d47a1;
    }
    .rank-top10 {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .change-up { color: #198754; font-weight: 600; }
    .change-down { color: #dc3545; font-weight: 600; }
    .change-new {
      background-color: #fff3cd;
      color: #664d03;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .table-responsive {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    th {
      white-space: nowrap;
      background-color: #f1f4f8 !important;
      color: #1b365d;
      font-size: 0.88rem;
    }
    td {
      vertical-align: middle;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="container-fluid py-3 px-2 px-md-4">

    <!-- Header & Sync Controls -->
    <div class="header-bar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h5 class="mb-0 fw-bold">Lugi Badminton — Ranking &amp; SJT-spelare</h5>
        <small class="opacity-75" id="lastUpdatedLabel">Senast uppdaterad: -</small>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button id="btnRefreshCache" class="btn btn-outline-light btn-sm" onclick="handleRebuildSjt()">
          Uppdatera tabell
        </button>
        <button id="btnFullSync" class="btn btn-warning btn-sm fw-semibold" onclick="handleFullSync()">
          Synka ny ranking
        </button>
      </div>
    </div>

    <!-- Alert Banner -->
    <div id="statusAlert" class="alert d-none py-2 px-3 mb-3" role="alert"></div>

    <!-- View Mode Switcher & Filters -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body py-2 px-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-lg-auto">
            <ul class="nav nav-pills" id="viewTabs">
              <li class="nav-item">
                <button class="nav-link active" data-view="sjt" onclick="switchView('sjt')">
                  SJT-spelare (Topp 50) <span class="badge bg-secondary ms-1" id="sjtCount">0</span>
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link" data-view="ranking" onclick="switchView('ranking')">
                  Alla rankade spelare <span class="badge bg-secondary ms-1" id="rankingCount">0</span>
                </button>
              </li>
            </ul>
          </div>

          <div class="col-6 col-md-3 col-lg-2 ms-lg-auto">
            <select id="ageFilter" class="form-select form-select-sm" onchange="renderTable()">
              <option value="">Alla åldersklasser</option>
              <option value="U13">U13</option>
              <option value="U15">U15</option>
              <option value="U17">U17</option>
              <option value="U19">U19</option>
              <option value="U22">U22</option>
              <option value="Senior">Senior</option>
            </select>
          </div>

          <div class="col-6 col-md-3 col-lg-2">
            <select id="eventFilter" class="form-select form-select-sm" onchange="renderTable()">
              <option value="">Alla kategorier</option>
              <option value="HS">HS (Herrsingel)</option>
              <option value="DS">DS (Damsingel)</option>
              <option value="HD">HD (Herrdubbel)</option>
              <option value="DD">DD (Damdubbel)</option>
              <option value="MD">MD (Mixeddubbel)</option>
            </select>
          </div>

          <div class="col-12 col-md-6 col-lg-3">
            <input type="search" id="searchInput" class="form-control form-control-sm"
                   placeholder="Sök spelare eller licensnr..." oninput="renderTable()">
          </div>
        </div>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="table table-hover mb-0" id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

    <!-- Server-injected initial payload -->
    <script id="initial-data" type="application/json"><?!= initialDataJson ?></script>
    <script>
        const INITIAL_DATA = JSON.parse(document.getElementById('initial-data').textContent || '{}');
    </script>

  <script>
    let appData = INITIAL_DATA || { sjt: { headers: [], rows: [] }, ranking: { headers: [], rows: [] }, lastUpdated: '' };
    let currentView = 'sjt';

    const AGE_ORDER = { U13: 1, U15: 2, U17: 3, U19: 4, U22: 5, Senior: 6 };
    const EVENT_COLS = ['HS', 'DS', 'HD', 'DD', 'MD'];

    document.addEventListener('DOMContentLoaded', () => {
      updateMeta();
      renderTable();
    });

    function updateMeta() {
      document.getElementById('lastUpdatedLabel').textContent =
        'Senast uppdaterad: ' + (appData.lastUpdated || '-');
      document.getElementById('sjtCount').textContent = (appData.sjt && appData.sjt.rows) ? appData.sjt.rows.length : 0;
      document.getElementById('rankingCount').textContent = (appData.ranking && appData.ranking.rows) ? appData.ranking.rows.length : 0;
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('#viewTabs .nav-link').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      renderTable();
    }

    function renderTable() {
      const dataset = currentView === 'sjt' ? appData.sjt : appData.ranking;
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      if (!dataset || !dataset.headers || dataset.headers.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td class="text-center py-4 text-muted">Ingen data tillgänglig ännu. Klicka på "Synka ny ranking".</td></tr>';
        return;
      }

      const ageVal = document.getElementById('ageFilter').value;
      const eventVal = document.getElementById('eventFilter').value;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      // Render Headers
      thead.innerHTML = '<tr>' + dataset.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join('') + '</tr>';

      const headers = dataset.headers;
      const ageIdx = headers.indexOf('Age Group');
      const eventIdx = headers.indexOf('Event');

      // Filter rows
      let rows = dataset.rows.filter((row) => {
        if (ageVal && ageIdx !== -1 && row[ageIdx] !== ageVal) return false;

        if (eventVal) {
          if (currentView === 'ranking' && eventIdx !== -1) {
            if (row[eventIdx] !== eventVal) return false;
          } else if (currentView === 'sjt') {
            const colIdx = headers.indexOf(eventVal);
            if (colIdx !== -1) {
              if (!row[colIdx]) return false;
            } else {
              // Fallback if SJT sheet uses concatenated "Event Rankings" column
              if (!row.join(' ').includes(eventVal + ':')) return false;
            }
          }
        }

        if (query && !row.join(' ').toLowerCase().includes(query)) {
          return false;
        }
        return true;
      });

      // Sort SJT view cleanly by Age Group (U13 -> U22) then Player Name
      if (currentView === 'sjt' && ageIdx !== -1) {
        rows = rows.slice().sort((a, b) => {
          const oa = AGE_ORDER[a[ageIdx]] || 99;
          const ob = AGE_ORDER[b[ageIdx]] || 99;
          return oa - ob || String(a[1] || '').localeCompare(String(b[1] || ''), 'sv');
        });
      }

      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${headers.length}" class="text-center py-4 text-muted">Inga spelare matchar valt filter.</td></tr>`;
        return;
      }

      // Render Body
      tbody.innerHTML = rows.map((row) => {
        const cells = row.map((cell, idx) => {
          const colName = headers[idx];
          const val = String(cell || '').trim();

          if (currentView === 'sjt' && EVENT_COLS.includes(colName) && val) {
            const num = Number(val);
            const topClass = (!isNaN(num) && num <= 10) ? 'rank-top10' : '';
            return `<td><span class="rank-badge ${topClass}">#${escapeHtml(val)}</span></td>`;
          }

          if (currentView === 'ranking' && colName === 'Placering' && val) {
            return `<td><span class="rank-badge">${escapeHtml(val)}</span></td>`;
          }

          if (currentView === 'ranking' && colName === 'Rank Change' && val) {
            if (val.startsWith('-')) return `<td><span class="change-down">${escapeHtml(val)}</span></td>`;
            if (val === 'New') return `<td><span class="change-new">Ny</span></td>`;
            if (val !== '0') return `<td><span class="change-up">+${escapeHtml(val.replace(/^\+/, ''))}</span></td>`;
            return `<td class="text-muted">0</td>`;
          }

          if (colName === 'Spelare' || colName === 'Name') {
            return `<td class="fw-semibold">${escapeHtml(val)}</td>`;
          }

          return `<td>${escapeHtml(val)}</td>`;
        }).join('');

        return `<tr>${cells}</tr>`;
      }).join('');
    }

    function handleRebuildSjt() {
      setLoading(true, 'Uppdaterar SJT-lista och tabell från kalkylarket...');
      google.script.run
        .withSuccessHandler((freshData) => {
          appData = freshData;
          updateMeta();
          renderTable();
          setLoading(false, 'Tabellen är uppdaterad.', 'success');
        })
        .withFailureHandler((err) => {
          setLoading(false, err.message || String(err), 'danger');
        })
        .rebuildSjtAndGetRankings();
    }

    function handleFullSync() {
      setLoading(true, 'Hämtar senaste ranking för alla 30 kategorier från TournamentSoftware (tar ca 45–60 sek)...');
      google.script.run
        .withSuccessHandler((freshData) => {
          appData = freshData;
          updateMeta();
          renderTable();
          setLoading(false, 'Ny ranking och SJT-spelare har hämtats och publicerats!', 'success');
        })
        .withFailureHandler((err) => {
          setLoading(false, err.message || String(err), 'danger');
        })
        .syncAllRankingsAndGet();
    }

    function setLoading(isLoading, message, alertType) {
      const btnCache = document.getElementById('btnRefreshCache');
      const btnSync = document.getElementById('btnFullSync');
      const alertBox = document.getElementById('statusAlert');

      btnCache.disabled = isLoading;
      btnSync.disabled = isLoading;

      if (isLoading) {
        alertBox.className = 'alert alert-info py-2 px-3 mb-3 d-flex align-items-center gap-2';
        alertBox.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span><span>${escapeHtml(message)}</span>`;
      } else if (message) {
        alertBox.className = `alert alert-${alertType || 'info'} py-2 px-3 mb-3`;
        alertBox.textContent = message;
        if (alertType === 'success') {
          setTimeout(() => alertBox.classList.add('d-none'), 5000);
        }
      } else {
        alertBox.classList.add('d-none');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
